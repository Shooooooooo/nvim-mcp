name: Release

# Publishes nvim-mcp to npm when a version tag is pushed (e.g. `v0.1.0`).
# Requires an `NPM_TOKEN` repository secret (npm automation token with publish
# rights). Cut a release with:
#
#   npm version <patch|minor|major>   # bumps package.json + creates the tag
#   git push --follow-tags
#
# `workflow_dispatch` lets you run it manually from the Actions tab as well.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
